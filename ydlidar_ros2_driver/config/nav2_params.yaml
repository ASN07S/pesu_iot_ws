nav2_params:
  ros__parameters:
    use_sim_time: False
    bt_navigator:
      plugin: "nav2_bt_navigator/BTNavigator"

    controller_server:
      ros__parameters:
        use_sim_time: False
        controller_plugin_types: ["dwb_core::DWBLocalPlanner"]
        controller_plugin_names: ["FollowPath"]

    planner_server:
      ros__parameters:
        expected_planner_frequency: 5.0
        use_sim_time: False
        planner_plugins: ["GridBased"]
        GridBased:
          plugin: "nav2_navfn_planner/NavfnPlanner"

    global_costmap:
      ros__parameters:
        yaml_filename: global_costmap.yaml

    local_costmap:
      ros__parameters:
        yaml_filename: local_costmap.yaml

